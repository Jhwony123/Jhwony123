<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0612"/>
      <stop offset="1" stop-color="#1c0b2e"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="40" r="1.6" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="70" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="30" r="1.6" opacity="0.6"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="60" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="45" r="1.6" opacity="0.7"><animate attributeName="opacity" values="0.7;0.3;0.7" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>
  <!-- city -->
  <g>
    <rect x="0" y="220" width="90" height="180" fill="#12081e"/>
    <rect x="100" y="180" width="70" height="220" fill="#170b26"/>
    <rect x="180" y="240" width="80" height="160" fill="#12081e"/>
    <rect x="270" y="200" width="60" height="200" fill="#170b26"/>
    <rect x="700" y="230" width="80" height="170" fill="#12081e"/>
    <rect x="790" y="190" width="70" height="210" fill="#170b26"/>
    <rect x="870" y="240" width="90" height="160" fill="#12081e"/>
    <rect x="970" y="210" width="70" height="190" fill="#170b26"/>
    <rect x="1050" y="250" width="90" height="150" fill="#12081e"/>
    <rect x="1150" y="200" width="80" height="200" fill="#170b26"/>
    <!-- windows -->
    <g fill="#fcee0a">
      <rect x="20" y="240" width="8" height="10"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></rect>
      <rect x="45" y="270" width="8" height="10" opacity="0.6"/>
      <rect x="115" y="200" width="8" height="10"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></rect>
      <rect x="140" y="230" width="8" height="10" opacity="0.7"/>
      <rect x="200" y="260" width="8" height="10"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.2s" repeatCount="indefinite"/></rect>
      <rect x="285" y="220" width="8" height="10" opacity="0.5"/>
      <rect x="300" y="250" width="8" height="10"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" repeatCount="indefinite"/></rect>
      <rect x="720" y="250" width="8" height="10"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></rect>
      <rect x="750" y="280" width="8" height="10" opacity="0.6"/>
      <rect x="810" y="210" width="8" height="10"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect x="890" y="260" width="8" height="10" opacity="0.7"/>
      <rect x="920" y="290" width="8" height="10"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.3s" repeatCount="indefinite"/></rect>
      <rect x="990" y="230" width="8" height="10"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.7s" repeatCount="indefinite"/></rect>
      <rect x="1070" y="270" width="8" height="10" opacity="0.6"/>
      <rect x="1170" y="220" width="8" height="10"><animate attributeName="opacity" values="1;0.3;1" dur="3.9s" repeatCount="indefinite"/></rect>
    </g>
    <g fill="#00f0ff">
      <rect x="30" y="300" width="8" height="10" opacity="0.6"/>
      <rect x="125" y="260" width="8" height="10"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/></rect>
      <rect x="735" y="310" width="8" height="10" opacity="0.5"/>
      <rect x="905" y="320" width="8" height="10"><animate attributeName="opacity" values="0.6;1;0.6" dur="3.0s" repeatCount="indefinite"/></rect>
      <rect x="1190" y="250" width="8" height="10" opacity="0.7"/>
    </g>
    <g fill="#ff2a6d">
      <rect x="55" y="330" width="8" height="10"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.1s" repeatCount="indefinite"/></rect>
      <rect x="825" y="240" width="8" height="10" opacity="0.6"/>
      <rect x="1095" y="300" width="8" height="10"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/></rect>
    </g>
  </g>
  <!-- ground -->
  <rect x="0" y="390" width="1280" height="10" fill="#0a0612"/>
  <!-- character (pixel hooded figure with soldering iron) -->
  <g transform="translate(430,120)">
    <animateTransform attributeName="transform" type="translate" values="430,120;430,114;430,120" dur="2.4s" repeatCount="indefinite"/>
    <!-- body/coat -->
    <rect x="0" y="104" width="160" height="176" rx="10" fill="#1a1030"/>
    <rect x="0" y="104" width="12" height="176" fill="#ff2a6d"/>
    <rect x="148" y="104" width="12" height="176" fill="#00f0ff"/>
    <!-- head/hood -->
    <rect x="30" y="0" width="100" height="110" rx="24" fill="#1a1030"/>
    <rect x="38" y="8" width="84" height="94" rx="18" fill="#0a0614"/>
    <!-- visor with blink glow -->
    <rect x="50" y="42" width="60" height="24" rx="4" fill="#fcee0a">
      <animate attributeName="opacity" values="1;1;0.15;1;1" keyTimes="0;0.45;0.5;0.55;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="58" y="49" width="18" height="10" fill="#fff8c0">
      <animate attributeName="opacity" values="1;1;0.15;1;1" keyTimes="0;0.45;0.5;0.55;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <!-- chest core -->
    <rect x="62" y="160" width="36" height="36" fill="#00f0ff" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="71" y="169" width="18" height="18" fill="#0a0614"/>
    <!-- soldering arm -->
    <g transform="translate(160,150)">
      <animateTransform attributeName="transform" type="translate" values="160,150;166,146;160,150" dur="1.6s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="70" height="16" fill="#1a1030"/>
      <rect x="66" y="2" width="26" height="12" fill="#fcee0a"/>
      <rect x="88" y="5" width="14" height="6" fill="#ffffff"/>
      <!-- spark -->
      <g transform="translate(104,2)">
        <rect x="0" y="0" width="6" height="6" fill="#ffffff"><animate attributeName="opacity" values="0;1;0" dur="0.4s" repeatCount="indefinite"/></rect>
        <rect x="8" y="6" width="5" height="5" fill="#fcee0a"><animate attributeName="opacity" values="1;0;1" dur="0.5s" repeatCount="indefinite"/></rect>
        <rect x="-4" y="8" width="4" height="4" fill="#00f0ff"><animate attributeName="opacity" values="0.2;1;0.2" dur="0.35s" repeatCount="indefinite"/></rect>
      </g>
    </g>
  </g>
  <!-- title -->
  <text x="700" y="140" font-family="monospace" font-size="52" font-weight="bold" fill="#fcee0a">JHONATAN RAFAEL</text>
  <text x="702" y="180" font-family="monospace" font-size="24" fill="#00f0ff">@Jhwony123 // hardware hacking lab</text>
  <text x="702" y="212" font-family="monospace" font-size="17" fill="#ff2a6d">learning by building - prototypes in development</text>
  <!-- scanline sweep -->
  <rect x="0" y="0" width="1280" height="3" fill="#00f0ff" opacity="0.15">
    <animate attributeName="y" values="0;400;0" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
